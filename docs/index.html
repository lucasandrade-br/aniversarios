<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parabens, Wilma!</title>
    <meta
      name="description"
      content="Uma homenagem interativa de aniversario para Wilma."
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #181923;
        --muted: #646779;
        --rose: #e11d48;
        --rose-dark: #be123c;
        --amber: #f59e0b;
        --sky: #0284c7;
        --line: rgba(225, 29, 72, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: radial-gradient(
          circle at top left,
          #ffe7ea 0,
          #fff9f4 34%,
          #f4fbff 68%,
          #fff 100%
        );
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        position: relative;
        min-height: 100vh;
      }

      .wrap {
        position: relative;
        display: flex;
        min-height: 100vh;
        width: min(1120px, 100%);
        margin: 0 auto;
        flex-direction: column;
        padding: 24px 20px;
      }

      header,
      .brand,
      .counter,
      .tag,
      .actions,
      .gift {
        display: flex;
        align-items: center;
      }

      header {
        justify-content: space-between;
        gap: 16px;
      }

      .mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 999px;
        background: var(--rose);
        color: white;
        box-shadow: 0 16px 35px rgba(225, 29, 72, 0.22);
      }

      .brand {
        gap: 12px;
      }

      .eyebrow {
        margin: 0;
        color: var(--rose-dark);
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(20px, 2vw, 26px);
      }

      .counter,
      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        color: var(--rose-dark);
        font-size: 14px;
        font-weight: 800;
      }

      .counter {
        gap: 8px;
        padding: 10px 16px;
      }

      .progress {
        height: 8px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 1px 4px rgba(24, 25, 35, 0.08);
      }

      .bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--rose), var(--amber), var(--sky));
        transition: width 0.45s ease;
      }

      .grid {
        display: grid;
        flex: 1;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
        align-items: center;
        gap: 48px;
        padding: 36px 0;
      }

      .tag {
        width: max-content;
        gap: 8px;
        padding: 10px 16px;
        background: #fff7ed;
        color: #92400e;
      }

      .question-number {
        margin-top: 26px;
        color: #075985;
        font-size: 16px;
        font-weight: 800;
      }

      h2 {
        max-width: 720px;
        margin-top: 12px;
        font-size: clamp(40px, 7vw, 64px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .reaction,
      .final-copy {
        max-width: 620px;
        margin-top: 22px;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.65;
      }

      .actions {
        margin-top: 34px;
        gap: 14px;
      }

      button {
        min-height: 56px;
        min-width: 170px;
        cursor: pointer;
        border-radius: 18px;
        border: 0;
        padding: 0 26px;
        font-size: 17px;
        font-weight: 900;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      .yes {
        background: var(--rose);
        color: white;
        box-shadow: 0 18px 34px rgba(225, 29, 72, 0.24);
      }

      .yes:hover {
        background: var(--rose-dark);
      }

      .no {
        border: 2px solid rgba(24, 25, 35, 0.1);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
      }

      .photo {
        position: relative;
        aspect-ratio: 4 / 5;
        width: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.76);
        padding: 12px;
        box-shadow: 0 30px 70px rgba(225, 29, 72, 0.14);
      }

      .photo-inner {
        display: flex;
        height: 100%;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(135deg, #ffe4e6, #fff7ed, #e0f2fe);
        text-align: center;
      }

      .photo img {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .placeholder {
        padding: 32px;
      }

      .placeholder-icon {
        display: grid;
        width: 96px;
        height: 96px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 999px;
        background: white;
        color: var(--rose);
        font-size: 42px;
        box-shadow: 0 16px 32px rgba(24, 25, 35, 0.1);
      }

      .placeholder-title {
        font-size: 28px;
        font-weight: 950;
      }

      .placeholder-hint {
        max-width: 270px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        line-height: 1.6;
      }

      .gift {
        max-width: 640px;
        margin-top: 28px;
        gap: 18px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        padding: 22px;
        box-shadow: 0 24px 55px rgba(225, 29, 72, 0.12);
      }

      .gift-icon {
        display: grid;
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
        place-items: center;
        border-radius: 999px;
        background: var(--rose);
        color: white;
        font-size: 24px;
      }

      .gift strong {
        display: block;
        margin-top: 4px;
        font-size: clamp(24px, 4vw, 34px);
      }

      .confetti {
        position: fixed;
        top: -40px;
        width: 12px;
        height: 18px;
        border-radius: 4px;
        animation: fall 7s linear infinite;
        pointer-events: none;
      }

      .c1 {
        left: 9%;
        background: var(--rose);
      }

      .c2 {
        left: 24%;
        background: var(--amber);
        animation-delay: 1.6s;
      }

      .c3 {
        left: 45%;
        background: var(--sky);
        animation-delay: 0.8s;
      }

      .c4 {
        left: 66%;
        background: #16a34a;
        animation-delay: 2.2s;
      }

      .c5 {
        left: 82%;
        background: #c026d3;
        animation-delay: 1.1s;
      }

      @keyframes fall {
        0% {
          opacity: 0;
          transform: translateY(-60px) rotate(0deg);
        }

        12% {
          opacity: 0.9;
        }

        100% {
          opacity: 0;
          transform: translateY(110vh) rotate(540deg);
        }
      }

      @media (max-width: 820px) {
        .counter {
          display: none;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        .photo {
          order: -1;
          max-width: 390px;
          margin: 0 auto;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        button {
          min-width: 0;
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="confetti c1"></span>
      <span class="confetti c2"></span>
      <span class="confetti c3"></span>
      <span class="confetti c4"></span>
      <span class="confetti c5"></span>

      <section class="wrap">
        <header>
          <div class="brand">
            <div class="mark" aria-hidden="true">!</div>
            <div>
              <p class="eyebrow">Missao Wilma</p>
              <h1>Confirmacao de aniversario</h1>
            </div>
          </div>
          <div class="counter" id="counter">1 de 5</div>
        </header>

        <div class="progress" aria-hidden="true">
          <div class="bar" id="bar"></div>
        </div>

        <div class="grid">
          <section>
            <div class="tag">Tudo indica que hoje tem festa</div>
            <p class="question-number" id="questionNumber">Pergunta 1</p>
            <h2 id="title"></h2>
            <p class="reaction" id="reaction">
              Responda com calma. A auditoria de aniversario e seria.
            </p>
            <div class="actions" id="actions">
              <button class="yes" type="button" data-answer="yes">Sim</button>
              <button class="no" type="button" data-answer="no">Nao</button>
            </div>
          </section>

          <section class="photo" aria-label="Foto da homenagem">
            <div class="photo-inner">
              <img id="photo" alt="" />
              <div class="placeholder" id="placeholder">
                <div class="placeholder-icon" id="placeholderIcon">♥</div>
                <p class="placeholder-title" id="placeholderTitle"></p>
                <p class="placeholder-hint" id="placeholderHint"></p>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          title: "Voce e mae dessas duas coisas lindas?",
          imageLabel: "Foto dos filhos",
          imageHint: "Coloque a foto em docs/images/filhos.jpg",
          src: "images/filhos.jpg",
          yesReaction: "Resposta aceita. O amor de mae entregou tudo.",
          noReaction: "Hmm... vamos fingir que foi erro de clique.",
        },
        {
          title: "Voce e casada com esse gala?",
          imageLabel: "Foto do casal",
          imageHint: "Coloque a foto em docs/images/casal.jpg",
          src: "images/casal.jpg",
          yesReaction: "Confirmado: casal oficial da celebracao.",
          noReaction: "Negar esse gala em publico? Audacioso.",
        },
        {
          title: "Voce e essa mulher maravilhosa da foto?",
          imageLabel: "Foto da Wilma",
          imageHint: "Coloque a foto em docs/images/wilma.jpg",
          src: "images/wilma.jpg",
          yesReaction: "Sem duvidas. Elegancia reconhecida.",
          noReaction: "O sistema detectou modestia em excesso.",
        },
        {
          title: "Voce deixa qualquer lugar mais alegre so de chegar?",
          imageLabel: "Momento especial",
          imageHint: "Coloque a foto em docs/images/momento.jpg",
          src: "images/momento.jpg",
          yesReaction: "Exatamente. Energia boa validada com sucesso.",
          noReaction: "Discordancia registrada, mas ignorada com carinho.",
        },
        {
          title: "Voce esta fazendo aniversario hoje?",
          imageLabel: "Aniversario da Wilma",
          imageHint: "Coloque a foto em docs/images/aniversario.jpg",
          src: "images/aniversario.jpg",
          yesReaction: "Agora sim. Pode preparar o sorriso.",
          noReaction: "Hoje e sim. O calendario esta do nosso lado.",
        },
      ];

      let step = 0;
      let answers = [];
      let reaction = "Responda com calma. A auditoria de aniversario e seria.";

      const counter = document.querySelector("#counter");
      const bar = document.querySelector("#bar");
      const questionNumber = document.querySelector("#questionNumber");
      const title = document.querySelector("#title");
      const reactionEl = document.querySelector("#reaction");
      const actions = document.querySelector("#actions");
      const photo = document.querySelector("#photo");
      const placeholder = document.querySelector("#placeholder");
      const placeholderIcon = document.querySelector("#placeholderIcon");
      const placeholderTitle = document.querySelector("#placeholderTitle");
      const placeholderHint = document.querySelector("#placeholderHint");

      function render() {
        const isFinal = step >= questions.length;
        bar.style.width = `${isFinal ? 100 : (step / questions.length) * 100}%`;
        counter.textContent = isFinal ? "Final liberado" : `${step + 1} de ${questions.length}`;

        if (isFinal) {
          const yesCount = answers.filter((answer) => answer === "yes").length;
          questionNumber.textContent = "Resultado oficial";
          title.textContent = "Parabens, Wilma!";
          reactionEl.textContent = `A investigacao terminou com ${yesCount} respostas positivas, muito amor envolvido e uma conclusao inevitavel: hoje e dia de celebrar voce.`;
          actions.innerHTML = `
            <div class="gift">
              <div class="gift-icon" aria-hidden="true">$</div>
              <div>
                <p class="eyebrow">Alerta de presente</p>
                <strong>Voce vai receber um PIX gigante.</strong>
                <p class="placeholder-hint">O tamanho exato esta em analise, mas a intencao ja foi aprovada por unanimidade.</p>
              </div>
            </div>
            <button class="yes" type="button" id="restart">Rever a surpresa</button>
          `;
          document.querySelector("#restart").addEventListener("click", restart);
          setPlaceholder("Wilma", "Tela final pronta para receber a melhor foto da aniversariante.", true);
          return;
        }

        const current = questions[step];
        questionNumber.textContent = `Pergunta ${step + 1}`;
        title.textContent = current.title;
        reactionEl.textContent = reaction;
        actions.innerHTML = `
          <button class="yes" type="button" data-answer="yes">Sim</button>
          <button class="no" type="button" data-answer="no">Nao</button>
        `;
        actions.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => answer(button.dataset.answer));
        });
        loadPhoto(current);
      }

      function setPlaceholder(label, hint, finalMode = false) {
        photo.style.display = "none";
        placeholder.style.display = "block";
        placeholderIcon.textContent = finalMode ? "$" : "♥";
        placeholderTitle.textContent = label;
        placeholderHint.textContent = hint;
      }

      function loadPhoto(current) {
        photo.onload = () => {
          placeholder.style.display = "none";
          photo.style.display = "block";
        };
        photo.onerror = () => setPlaceholder(current.imageLabel, current.imageHint);
        photo.alt = current.imageLabel;
        photo.src = current.src;
      }

      function answer(value) {
        const current = questions[step];
        answers.push(value);
        reaction = value === "yes" ? current.yesReaction : current.noReaction;
        step += 1;
        render();
      }

      function restart() {
        step = 0;
        answers = [];
        reaction = "Responda com calma. A auditoria de aniversario e seria.";
        render();
      }

      render();
    </script>
  </body>
</html>
