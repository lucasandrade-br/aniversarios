<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parabéns, Wilma!</title>
    <meta
      name="description"
      content="Uma homenagem interativa de aniversário para Wilma."
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #181923;
        --muted: #646779;
        --rose: #e11d48;
        --rose-dark: #be123c;
        --amber: #f59e0b;
        --sky: #0284c7;
        --line: rgba(225, 29, 72, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        overflow-x: hidden;
        background: radial-gradient(
          circle at top left,
          #ffe7ea 0,
          #fff9f4 34%,
          #f4fbff 68%,
          #fff 100%
        );
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }

      .wrap {
        position: relative;
        display: flex;
        min-height: 100svh;
        width: min(1120px, 100%);
        margin: 0 auto;
        flex-direction: column;
        padding: 12px 16px;
      }

      header,
      .brand,
      .counter,
      .tag,
      .actions,
      .gift {
        display: flex;
        align-items: center;
      }

      header {
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        min-width: 0;
        gap: 10px;
      }

      .mark {
        display: grid;
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 999px;
        background: var(--rose);
        color: white;
        font-weight: 950;
        box-shadow: 0 16px 35px rgba(225, 29, 72, 0.22);
      }

      .eyebrow {
        margin: 0;
        color: var(--rose-dark);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        overflow: hidden;
        font-size: 16px;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .counter,
      .tag {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        color: var(--rose-dark);
        font-size: 14px;
        font-weight: 800;
      }

      .counter {
        display: none;
        gap: 8px;
        padding: 10px 16px;
      }

      .progress {
        height: 6px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: inset 0 1px 4px rgba(24, 25, 35, 0.08);
      }

      .bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--rose), var(--amber), var(--sky));
        transition: width 0.45s ease;
      }

      .grid {
        display: grid;
        flex: 1;
        grid-template-columns: 1fr;
        align-content: center;
        gap: 12px;
        padding: 12px 0;
      }

      .photo {
        position: relative;
        aspect-ratio: 4 / 3;
        width: 100%;
        height: min(37svh, 310px);
        max-width: 430px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.76);
        padding: 8px;
        box-shadow: 0 30px 70px rgba(225, 29, 72, 0.14);
      }

      .photo-inner {
        display: flex;
        height: 100%;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #ffe4e6, #fff7ed, #e0f2fe);
        text-align: center;
      }

      .photo img {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tag {
        width: max-content;
        max-width: 100%;
        gap: 8px;
        padding: 7px 12px;
        background: #fff7ed;
        color: #92400e;
        font-size: 12px;
      }

      .question-number {
        margin-top: 8px;
        color: #075985;
        font-size: 14px;
        font-weight: 800;
      }

      h2 {
        max-width: 720px;
        margin-top: 6px;
        font-size: clamp(1.85rem, 8.5vw, 2.45rem);
        line-height: 1.03;
        letter-spacing: 0;
      }

      .reaction {
        display: -webkit-box;
        max-width: 620px;
        margin-top: 8px;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        line-height: 1.55;
      }

      .actions {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .actions.final-actions {
        display: flex;
        width: 100%;
        max-width: 640px;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      button {
        min-height: 48px;
        min-width: 0;
        width: 100%;
        cursor: pointer;
        border-radius: 18px;
        border: 0;
        padding: 0 18px;
        font-size: 16px;
        font-weight: 950;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      button:hover {
        transform: translateY(-2px);
      }

      .yes {
        background: var(--rose);
        color: white;
        box-shadow: 0 18px 34px rgba(225, 29, 72, 0.24);
      }

      .yes:hover {
        background: var(--rose-dark);
      }

      .no {
        border: 2px solid rgba(24, 25, 35, 0.1);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
      }

      .placeholder {
        padding: 20px;
      }

      .placeholder-icon {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        place-items: center;
        border-radius: 999px;
        background: white;
        color: var(--rose);
        font-size: 30px;
        box-shadow: 0 16px 32px rgba(24, 25, 35, 0.1);
      }

      .placeholder-title {
        font-size: 21px;
        font-weight: 950;
      }

      .placeholder-hint {
        max-width: 270px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        line-height: 1.55;
      }

      .gift {
        width: 100%;
        max-width: 640px;
        margin-top: 0;
        gap: 12px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        padding: 16px;
        box-shadow: 0 24px 55px rgba(225, 29, 72, 0.12);
      }

      .gift-icon {
        display: grid;
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 999px;
        background: var(--rose);
        color: white;
        font-size: 22px;
        font-weight: 950;
      }

      .gift strong {
        display: block;
        margin-top: 4px;
        font-size: 22px;
      }

      .pix-button {
        margin-top: 0;
        background: var(--ink);
        color: white;
        animation: pix-button-pulse 1.35s ease-in-out infinite;
      }

      .pix-prize {
        width: 100%;
        border: 2px solid #fcd34d;
        border-radius: 20px;
        background: #fffbeb;
        padding: 16px;
        text-align: center;
        box-shadow: 0 24px 55px rgba(245, 158, 11, 0.26);
        animation: pix-prize-pop 0.72s ease-out, pix-prize-pulse 1.2s ease-in-out infinite;
      }

      .pix-label {
        color: #92400e;
        font-size: 13px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .pix-value {
        color: var(--rose-dark);
        font-size: clamp(2.25rem, 12vw, 4.75rem);
        font-weight: 950;
        line-height: 1;
      }

      .confetti {
        position: fixed;
        top: -40px;
        width: 12px;
        height: 18px;
        border-radius: 4px;
        animation: fall 7s linear infinite;
        pointer-events: none;
      }

      .c1 {
        left: 9%;
        background: var(--rose);
      }

      .c2 {
        left: 24%;
        background: var(--amber);
        animation-delay: 1.6s;
      }

      .c3 {
        left: 45%;
        background: var(--sky);
        animation-delay: 0.8s;
      }

      .c4 {
        left: 66%;
        background: #16a34a;
        animation-delay: 2.2s;
      }

      .c5 {
        left: 82%;
        background: #c026d3;
        animation-delay: 1.1s;
      }

      @keyframes fall {
        0% {
          opacity: 0;
          transform: translateY(-60px) rotate(0deg);
        }

        12% {
          opacity: 0.9;
        }

        100% {
          opacity: 0;
          transform: translateY(110vh) rotate(540deg);
        }
      }

      @keyframes pix-button-pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 18px 36px rgba(24, 25, 35, 0.22);
        }

        50% {
          transform: scale(1.035);
          box-shadow: 0 24px 48px rgba(225, 29, 72, 0.28);
        }
      }

      @keyframes pix-prize-pop {
        0% {
          opacity: 0;
          transform: scale(0.78) translateY(10px);
        }

        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes pix-prize-pulse {
        0%,
        100% {
          box-shadow: 0 22px 44px rgba(251, 191, 36, 0.28);
        }

        50% {
          box-shadow: 0 30px 64px rgba(225, 29, 72, 0.24);
        }
      }

      @media (min-width: 821px) {
        .wrap {
          padding: 24px 40px;
        }

        .mark {
          width: 44px;
          height: 44px;
        }

        .eyebrow {
          font-size: 14px;
        }

        h1 {
          font-size: 26px;
        }

        .counter {
          display: flex;
        }

        .progress {
          height: 8px;
          margin-top: 24px;
        }

        .grid {
          grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
          align-items: center;
          gap: 48px;
          padding: 36px 0;
        }

        .photo {
          order: 2;
          aspect-ratio: 4 / 5;
          height: auto;
          border-radius: 32px;
          padding: 12px;
        }

        .photo-inner {
          border-radius: 24px;
        }

        .tag {
          padding: 10px 16px;
          font-size: 14px;
        }

        .question-number {
          margin-top: 26px;
          font-size: 16px;
        }

        h2 {
          margin-top: 12px;
          font-size: clamp(40px, 7vw, 64px);
        }

        .reaction {
          margin-top: 22px;
          font-size: 19px;
          line-height: 1.65;
        }

        .actions {
          display: flex;
          margin-top: 34px;
          gap: 14px;
        }

        .actions.final-actions {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
        }

        button {
          min-height: 56px;
          min-width: 170px;
          width: auto;
          padding: 0 26px;
          font-size: 17px;
        }

        .placeholder {
          padding: 32px;
        }

        .placeholder-icon {
          width: 96px;
          height: 96px;
          margin-bottom: 20px;
          font-size: 42px;
        }

        .placeholder-title {
          font-size: 28px;
        }

        .placeholder-hint {
          margin-top: 12px;
          font-size: 14px;
          line-height: 1.6;
        }

        .gift {
          margin-top: 0;
          gap: 18px;
          border-radius: 24px;
          padding: 22px;
        }

        .gift-icon {
          width: 50px;
          height: 50px;
          font-size: 24px;
        }

        .gift strong {
          font-size: clamp(24px, 4vw, 34px);
        }

        .actions.final-actions .pix-button {
          width: 100%;
          min-width: 0;
        }

        .pix-prize {
          padding: 20px 32px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }

        .confetti {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="confetti c1"></span>
      <span class="confetti c2"></span>
      <span class="confetti c3"></span>
      <span class="confetti c4"></span>
      <span class="confetti c5"></span>

      <section class="wrap">
        <header>
          <div class="brand">
            <div class="mark" aria-hidden="true">!</div>
            <div>
              <p class="eyebrow">Missão Wilma</p>
              <h1>Confirmação de aniversário</h1>
            </div>
          </div>
          <div class="counter" id="counter">1 de 5</div>
        </header>

        <div class="progress" aria-hidden="true">
          <div class="bar" id="bar"></div>
        </div>

        <div class="grid">
          <section>
            <div class="tag">Tudo indica que hoje tem festa</div>
            <p class="question-number" id="questionNumber">Pergunta 1</p>
            <h2 id="title"></h2>
            <p class="reaction" id="reaction">
              Responda com calma. A auditoria de aniversário é séria.
            </p>
            <div class="actions" id="actions">
              <button class="yes" type="button" data-answer="yes">Sim</button>
              <button class="no" type="button" data-answer="no">Não</button>
            </div>
          </section>

          <section class="photo" aria-label="Foto da homenagem">
            <div class="photo-inner">
              <img id="photo" alt="" />
              <div class="placeholder" id="placeholder">
                <div class="placeholder-icon" id="placeholderIcon">♥</div>
                <p class="placeholder-title" id="placeholderTitle"></p>
                <p class="placeholder-hint" id="placeholderHint"></p>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const questions = [
        {
          title: "Você é mãe dessas duas coisas lindas?",
          imageLabel: "Foto dos filhos",
          imageHint: "Coloque a foto em docs/images/filhos.jpg",
          src: "images/filhos.jpg",
          yesReaction: "Resposta aceita. O amor de mãe entregou tudo.",
          noReaction: "Hmm... vamos fingir que foi erro de clique.",
        },
        {
          title: "Você é casada com esse galã?",
          imageLabel: "Foto do casal",
          imageHint: "Coloque a foto em docs/images/casal.jpeg",
          src: "images/casal.jpeg",
          yesReaction: "Confirmado: casal oficial da celebração.",
          noReaction: "Negar esse galã em público? Audacioso.",
        },
        {
          title: "Você é essa mulher maravilhosa da foto?",
          imageLabel: "Foto da Wilma",
          imageHint: "Coloque a foto em docs/images/wilma.jpeg",
          src: "images/wilma.jpeg",
          yesReaction: "Sem dúvidas. Elegância reconhecida.",
          noReaction: "O sistema detectou modéstia em excesso.",
        },
        {
          title: "Você é sogra desse bonitão?",
          imageLabel: "Foto do genro",
          imageHint: "Coloque a foto em docs/images/genro.jpg",
          src: "images/genro.jpg",
          yesReaction: "Confirmado: sogra de respeito e genro aprovado.",
          noReaction: "Negar esse bonitão? O júri pede revisão.",
        },
        {
          title: "Você está fazendo aniversário hoje?",
          imageLabel: "Aniversário da Wilma",
          imageHint: "Coloque a foto em docs/images/aniversario.jpeg",
          src: "images/aniversario.jpeg",
          yesReaction: "Agora sim. Pode preparar o sorriso.",
          noReaction: "Hoje é sim. O calendário está do nosso lado.",
        },
      ];

      let step = 0;
      let answers = [];
      let pixRevealed = false;
      let reaction = "Responda com calma. A auditoria de aniversário é séria.";

      const counter = document.querySelector("#counter");
      const bar = document.querySelector("#bar");
      const questionNumber = document.querySelector("#questionNumber");
      const title = document.querySelector("#title");
      const reactionEl = document.querySelector("#reaction");
      const actions = document.querySelector("#actions");
      const photo = document.querySelector("#photo");
      const placeholder = document.querySelector("#placeholder");
      const placeholderIcon = document.querySelector("#placeholderIcon");
      const placeholderTitle = document.querySelector("#placeholderTitle");
      const placeholderHint = document.querySelector("#placeholderHint");

      function render() {
        const isFinal = step >= questions.length;
        bar.style.width = `${isFinal ? 100 : (step / questions.length) * 100}%`;
        counter.textContent = isFinal ? "Final liberado" : `${step + 1} de ${questions.length}`;

        if (isFinal) {
          actions.classList.add("final-actions");
          const yesCount = answers.filter((answer) => answer === "yes").length;
          questionNumber.textContent = "Resultado oficial";
          title.textContent = "Parabéns, Wilma!";
          reactionEl.textContent = `A investigação terminou com ${yesCount} respostas positivas, muito amor envolvido e uma conclusão inevitável: hoje é dia de celebrar você.`;
          actions.innerHTML = `
            <div class="gift">
              <div class="gift-icon" aria-hidden="true">$</div>
              <div>
                <p class="eyebrow">Alerta de presente</p>
                <strong>O presente da aniversariante foi aprovado.</strong>
                <p class="placeholder-hint">Agora falta só tocar no botão para liberar o PIX gigante.</p>
              </div>
            </div>
            ${
              pixRevealed
                ? `<div class="pix-prize">
                    <p class="pix-label">PIX gigante liberado</p>
                    <p class="pix-value">R$ 800,00</p>
                    <p class="placeholder-hint">Presente aprovado para a aniversariante!</p>
                  </div>`
                : `<button class="pix-button" type="button" id="receivePix">RECEBER PIX</button>`
            }
          `;
          const receivePix = document.querySelector("#receivePix");
          if (receivePix) {
            receivePix.addEventListener("click", () => {
              pixRevealed = true;
              render();
            });
          }
          return;
        }

        const current = questions[step];
        actions.classList.remove("final-actions");
        questionNumber.textContent = `Pergunta ${step + 1}`;
        title.textContent = current.title;
        reactionEl.textContent = reaction;
        actions.innerHTML = `
          <button class="yes" type="button" data-answer="yes">Sim</button>
          <button class="no" type="button" data-answer="no">Não</button>
        `;
        actions.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => answer(button.dataset.answer));
        });
        loadPhoto(current);
      }

      function setPlaceholder(label, hint, finalMode = false) {
        photo.style.display = "none";
        placeholder.style.display = "block";
        placeholderIcon.textContent = finalMode ? "$" : "♥";
        placeholderTitle.textContent = label;
        placeholderHint.textContent = hint;
      }

      function loadPhoto(current) {
        photo.onload = () => {
          placeholder.style.display = "none";
          photo.style.display = "block";
        };
        photo.onerror = () => setPlaceholder(current.imageLabel, current.imageHint);
        photo.alt = current.imageLabel;
        photo.src = current.src;
      }

      function answer(value) {
        const current = questions[step];
        answers.push(value);
        reaction = value === "yes" ? current.yesReaction : current.noReaction;
        step += 1;
        render();
      }

      render();
    </script>
  </body>
</html>
